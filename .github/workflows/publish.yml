name: Publish

# 触发方式：
#   1. 合并 PR 到 main（push）→ 自动升 patch 版本、发布、打 tag、建 Release
#   2. workflow_dispatch → 手动触发，同上
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write    # 写回版本号、创建 tag 和 Release
  id-token: write    # npm Trusted Publishing (OIDC)
  packages: write    # GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest
    # 避免 workflow 自己提交版本号造成的无限循环
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing 需要 npm CLI >= 11.5.1 / Node >= 22.14
      - name: Ensure npm CLI version
        run: npm install -g npm@latest

      # 基于 npmjs 已发布的最新版本，自动递增 patch
      - name: Bump patch version
        id: bump
        run: |
          published=$(npm view magpie-agent-paseo version --registry=https://registry.npmjs.org 2>/dev/null || echo "0.0.0")
          current=$(node -p "require('./package.json').version")
          # 同时参考本地 tag，避免 npm registry 同步延迟导致重复发布
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          [ -z "$latest_tag" ] && latest_tag="0.0.0"
          # 取所有来源中最大的版本，避免回退或重复
          base=$(printf '%s\n%s\n%s\n' "$published" "$current" "$latest_tag" | sort -V | tail -1)
          major=$(echo "$base" | cut -d. -f1)
          minor=$(echo "$base" | cut -d. -f2)
          patch=$(echo "$base" | cut -d. -f3)
          next="${major}.${minor}.$((patch + 1))"
          npm pkg set version="$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Bumped version: $base -> $next"

      # 发布前预览打包内容
      - name: Preview package contents
        run: npm pack --dry-run

      # 1) 发布到 npmjs —— 使用 Trusted Publishing，无需 token/OTP
      - name: Publish to npmjs
        run: npm publish

      # 2) 发布到 GitHub Packages —— 只支持 scoped 包名，需临时改名
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp package.json /tmp/package.json.orig
          npm config set //npm.pkg.github.com/:_authToken="$NODE_AUTH_TOKEN"
          npm pkg set name=@anyaoqi/magpie-agent-paseo
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm publish --access public
          cp /tmp/package.json.orig package.json

      # 将递增后的版本号写回仓库
      - name: Commit bumped version
        env:
          NEXT_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          # 把递增后的版本应用到最新的 main，避免覆盖 PR 合并后的其他改动
          npm pkg set version="$NEXT_VERSION"
          git add package.json
          git diff --staged --quiet || git commit -m "chore: bump version to $NEXT_VERSION [skip ci]"
          git push origin main

      # 创建 tag 并推送（指向刚提交的版本 commit）
      - name: Create tag
        env:
          NEXT_VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git tag "v$NEXT_VERSION"
          git push origin "v$NEXT_VERSION"

      # 创建 GitHub Release（自动生成 changelog）
      - name: Create GitHub Release
        env:
          NEXT_VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$NEXT_VERSION" \
            --title "v$NEXT_VERSION" \
            --generate-notes \
            --target main
